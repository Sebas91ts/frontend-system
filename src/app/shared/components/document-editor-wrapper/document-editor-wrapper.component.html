<section class="document-editor-shell">
  <div *ngIf="loading && !editorReady" class="editor-state">Cargando editor documental...</div>
  <div *ngIf="error" class="editor-state editor-error">{{ error }}</div>
  <div
    *ngIf="saveState !== 'idle'"
    class="save-state"
    [class.save-state--saving]="saveState === 'saving'"
    [class.save-state--saved]="saveState === 'saved'"
  >
    {{ saveStateMessage }}
  </div>
  <div #editorHost class="editor-host" [style.height]="height"></div>
</section>
